esphome:
  name: btf-rgbcct

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

external_components:
  - source: github://erman-dev/btf-rgbcct-light@claude/esphome-rgbcct-light-dfilxb
    components: [btf_rgbcct]
  # local checkout instead:
  # - source: {type: local, path: components}

light:
  - platform: btf_rgbcct
    name: "BASEC"
    id: basec
    output_id: basec_out
    pin: GPIO21
    power_pin: GPIO7              # strip supply switch: plain on/off, not ledc
    num_leds: 50                  # number of segments on the strip
    color_correct: [88%, 88%, 88%, 100%]   # power cap per channel: [R, G, B, white]
    restore_mode: RESTORE_DEFAULT_OFF
    default_transition_length: 0.2s
    effects:
      - addressable_rainbow:
      - addressable_lambda:
          name: "CCT gradient"
          update_interval: 100ms
          lambda: |-
            for (int i = 0; i < it.size(); i++) {
              it[i] = Color(0, 0, 0, 255);
              id(basec_out).set_pixel_warm_fraction(i, 1.0f - float(i) / (it.size() - 1));
            }
